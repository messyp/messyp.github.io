<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Super Plumber Bros - 1-1 Tribute</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <header>
      <h1>Super Plumber Bros</h1>
      <p class="subtitle">A tiny 2D side-scrolling tribute to the NES classic</p>
    </header>
    <section class="game-wrapper">
      <canvas id="game" width="256" height="240" aria-label="Mario inspired platformer"></canvas>
      <div class="controls">
        <p><strong>Controls:</strong> Arrow keys to move • Z / Space to jump • Enter to start</p>
      </div>
    </section>
  </main>
  <script src="game.js"></script>
</body>
</html>
